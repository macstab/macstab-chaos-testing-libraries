# git-cliff configuration: regenerates CHANGELOG.md from the commit history. Run by the
# `release` job of .github/workflows/release.yml on every release tag; the result is attached to
# the GitHub release and merged to main through a PR.
#
# Only conventional commits (type(scope): subject) appear; anything else is dropped. Lines inside
# the triple-quoted templates are Tera template text, not TOML comments.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# One section per version (or [Unreleased]), one subsection per commit group, one bullet per
# commit with optional bold scope, a BREAKING marker and a link to the commit.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} (**BREAKING**){% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/macstab/macstab-chaos-testing-libraries/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Turns a trailing "(#123)" or "(text #123)" PR/issue reference into a link.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/macstab/macstab-chaos-testing-libraries/issues/${2}))" },
]
# First match wins. The security parser matches the commit body, so it only catches commits whose
# type matched none of the rules above it.
commit_parsers = [
  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs",     group = "Documentation" },
  { message = "^test",     group = "Testing" },
  { message = "^chore",    group = "Miscellaneous" },
  { message = "^ci",       group = "CI" },
  { message = "^build",    group = "Build" },
  { body = ".*security",   group = "Security" },
]
protect_breaking_commits = false
# filter_commits drops commits that match no parser. tag_pattern makes bare x.y.z tags the
# version boundaries, as release.yml is triggered by them; a stray v-prefixed tag is ignored.
filter_commits = true
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
