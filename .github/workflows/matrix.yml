name: matrix

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: ${{ matrix.target.libc }}-${{ matrix.target.arch }} (${{ matrix.target.runner }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { libc: glibc, arch: amd64, runner: ubuntu-24.04 }
          - { libc: glibc, arch: arm64, runner: ubuntu-24.04-arm }
          - { libc: musl,  arch: amd64, runner: ubuntu-24.04 }
          - { libc: musl,  arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker buildx prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make docker-buildx

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cross-build ${{ matrix.target.libc }}-${{ matrix.target.arch }}
        run: make cross-${{ matrix.target.libc }}-${{ matrix.target.arch }}

      - name: List built shared objects
        run: |
          ls -lah dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so
          file  dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so

      - name: Run integration tests
        run: |
          set -eu
          case "${{ matrix.target.libc }}" in
            glibc)
              SCRIPTS="test/runtime/test_glibc.sh
                       test/runtime/test_net_glibc.sh
                       test/runtime/test_dns_glibc.sh
                       test/runtime/test_time_glibc.sh
                       test/runtime/test_memory_glibc.sh
                       test/runtime/test_process_glibc.sh"
              ;;
            musl)
              SCRIPTS="test/runtime/test_alpine.sh
                       test/runtime/test_net_alpine.sh
                       test/runtime/test_dns_alpine.sh
                       test/runtime/test_time_alpine.sh
                       test/runtime/test_memory_alpine.sh
                       test/runtime/test_process_alpine.sh"
              ;;
          esac
          for script in $SCRIPTS; do
            echo "::group::$script linux/${{ matrix.target.arch }}"
            sh "$script" linux/${{ matrix.target.arch }}
            echo "::endgroup::"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target.libc }}-${{ matrix.target.arch }}
          path: dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so
          retention-days: 14
          if-no-files-found: error
