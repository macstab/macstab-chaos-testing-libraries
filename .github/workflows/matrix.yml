# Builds and tests the four release variants (glibc|musl x amd64|arm64) on every branch push.
#
# Each variant builds on a runner of its own architecture (ubuntu-24.04 / ubuntu-24.04-arm), so
# no emulation and no cross-toolchain is involved; musl variants use musl-gcc from musl-tools.
# The per-libc runtime suites then load the fresh dist/ objects in glibc or Alpine containers
# of the same architecture. The objects are uploaded for 14 days for manual inspection; release
# binaries are rebuilt by release.yml.
name: matrix

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']

permissions:
  contents: read

# A newer push to the same ref supersedes the running matrix.
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 runs JavaScript actions on Node 24 ahead of GitHub's
# default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Runtime suites exit with CHAOS_SKIP_EXIT when they cannot run (no docker, foreign
  # architecture); 1 turns such a skip into a failure instead of a silent pass.
  CHAOS_SKIP_EXIT: "1"

jobs:
  cross-build:
    name: ${{ matrix.target.libc }}-${{ matrix.target.arch }} (${{ matrix.target.runner }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { libc: glibc, arch: amd64, runner: ubuntu-24.04 }
          - { libc: glibc, arch: arm64, runner: ubuntu-24.04-arm }
          - { libc: musl,  arch: amd64, runner: ubuntu-24.04 }
          - { libc: musl,  arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          PKGS="build-essential gcc make"
          if [ "${{ matrix.target.libc }}" = "musl" ]; then
            PKGS="$PKGS musl-tools"
          fi
          sudo apt-get install -y --no-install-recommends $PKGS

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cross-build ${{ matrix.target.libc }}-${{ matrix.target.arch }}
        run: |
          # The Makefile defaults to the cross-compiler name aarch64-linux-musl-gcc; on a native
          # arm64 runner musl-tools installs the compiler as musl-gcc.
          EXTRA_ARGS=""
          if [ "${{ matrix.target.libc }}" = "musl" ] && \
             [ "${{ matrix.target.arch }}" = "arm64" ]; then
            EXTRA_ARGS="MUSL_ARM64_CC=musl-gcc"
          fi
          make cross-${{ matrix.target.libc }}-${{ matrix.target.arch }} $EXTRA_ARGS

      - name: List built shared objects
        run: |
          ls -lah dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so
          file  dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so

      - name: Run integration tests
        run: |
          set -eu
          case "${{ matrix.target.libc }}" in
            glibc)
              SCRIPTS="test/runtime/test_glibc.sh
                       test/runtime/test_net_glibc.sh
                       test/runtime/test_dns_glibc.sh
                       test/runtime/test_time_glibc.sh
                       test/runtime/test_memory_glibc.sh
                       test/runtime/test_process_glibc.sh"
              ;;
            musl)
              SCRIPTS="test/runtime/test_alpine.sh
                       test/runtime/test_net_alpine.sh
                       test/runtime/test_dns_alpine.sh
                       test/runtime/test_time_alpine.sh
                       test/runtime/test_memory_alpine.sh
                       test/runtime/test_process_alpine.sh"
              ;;
          esac
          for script in $SCRIPTS; do
            echo "::group::$script linux/${{ matrix.target.arch }}"
            sh "$script" linux/${{ matrix.target.arch }}
            echo "::endgroup::"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target.libc }}-${{ matrix.target.arch }}
          path: dist/libchaos-*-${{ matrix.target.libc }}-${{ matrix.target.arch }}.so
          retention-days: 14
          if-no-files-found: error
