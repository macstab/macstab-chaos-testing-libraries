# Pre-release benchmark gate: the release workflow's sweep and release-over-release gate, run on
# every pull request into main (the develop -> main release PR) and on demand, so a performance
# regression fails the pull request instead of being found after the tag.
#
#   sweep  per variant on a native runner of its architecture: benchmark scenario check
#          (every scenario loads, every errno scenario fires on each call), then a 10-run sweep
#          of benchmark/suite.tsv
#   gate   benchmark/release-gate.sh against the last published release that is not a
#          prerelease; the verdict and per-variant reports appear on the run page and as an
#          artifact. A regression fails this check.
#
# Numbers are ADVISORY (shared GitHub runners); the gate therefore compares medians of 10 runs
# per side and requires both a > 15 % and a > 25 ns slowdown that is statistically significant.
# A benchmark whose kernel or scenario revision changed (benchmark/suite.tsv) is re-baselined,
# not gated. Release procedure: RELEASING.md.
name: bench

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running sweep.
concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep (${{ matrix.libc }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            arch: amd64
            runner: ubuntu-24.04
          - libc: musl
            arch: amd64
            runner: ubuntu-24.04
          - libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
          - libc: musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # perf_event_paranoid=1 lets the harness open per-process hardware counters; otherwise
      # the envelopes carry the refusal reason instead of PMU data.
      - name: Lower perf_event_paranoid
        run: echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid

      - name: Check benchmark scenarios
        run: ./benchmark/run-bench.sh --check-scenarios --libc=${{ matrix.libc }}

      # Exit 1 is the A/B driver reporting preloaded slower than baseline, which preloading
      # always is; only another exit means the sweep failed.
      - name: Run benchmark sweep
        env:
          BENCH_WARMUP: 5000
          BENCH_ITERS: 100000
          BENCH_REPORT_DIR: ${{ github.workspace }}/sweep
        run: |
          mkdir -p "$BENCH_REPORT_DIR"
          rc=0
          ./benchmark/run-bench.sh --full --runs=10 --libc=${{ matrix.libc }} --compare || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::run-bench.sh failed with exit $rc"
            exit "$rc"
          fi

      - name: Upload envelopes
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.libc }}-${{ matrix.arch }}
          path: sweep/
          retention-days: 30
          if-no-files-found: error

  gate:
    name: release-over-release gate
    runs-on: ubuntu-24.04
    needs: [sweep]
    steps:
      - uses: actions/checkout@v4

      - name: Download envelopes
        uses: actions/download-artifact@v4
        with:
          path: envelopes/
          pattern: sweep-*

      # Artifact directories are named sweep-<libc>-<arch>; the gate expects <libc>-<arch>.
      - name: Arrange envelopes per variant
        run: |
          for d in envelopes/sweep-*; do
            mv "$d" "envelopes/${d#envelopes/sweep-}"
          done
          ls envelopes

      - name: Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          sh benchmark/release-gate.sh envelopes reports || rc=$?
          cat reports/gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
