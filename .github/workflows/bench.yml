# Pre-release benchmark gate: the release workflow's sweep and release-over-release gate, run on
# every pull request into main (the develop -> main release PR) and into develop (a feature
# branch), and on demand, so a performance regression fails the pull request instead of being
# found after the tag. Gating the develop pull request too is deliberate: the correctness gates
# (ci, matrix, codeql) measure no cost at all, so without it the release pull request is the
# first run ever and a regression arrives with a whole release behind it.
#
#   sweep  per variant on a native runner of its architecture: benchmark scenario check
#          (every scenario loads, every errno scenario fires on each call), then a 10-run sweep
#          of benchmark/suite.tsv
#   gate   benchmark/release-gate.sh against the last published release that is not a
#          prerelease; the verdict and per-variant reports appear on the run page and as an
#          artifact. A regression fails this check.
#
# Numbers are ADVISORY (shared GitHub runners); the gate therefore compares medians of 10 runs
# per side and requires both a > 15 % and a > 25 ns slowdown that is statistically significant.
# A benchmark whose kernel or scenario revision changed (benchmark/suite.tsv) is re-baselined,
# not gated. Release procedure: RELEASING.md.
name: bench

on:
  # A feature branch measures itself against its merge base, A B A B on one runner, and only
  # the libraries it touched (the ab job). Both merge gates measure the whole suite against
  # the last release instead: a gate that measured a different subset per pull request would
  # stop covering whatever that pull request did not happen to touch.
  push:
    branches-ignore: [main, develop]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, develop]
    # A pull request that changes only Markdown (the release workflow's CHANGELOG and
    # benchmark-matrix pull requests, documentation) changes nothing the sweep measures.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      libs:
        description: >-
          Libraries to measure, comma separated (io, net, dns, time, memory, process).
          Empty derives them from the diff against the merge base. Only the A/B job on a
          feature branch reads this; a run on develop or main is a merge gate and never
          filters.
        required: false
        default: ''
      runs:
        description: >-
          Runs per side in the A/B job (default 5). Raise it when a question is close:
          five runs per side do not resolve ten percentage points.
        required: false
        default: '5'

permissions:
  contents: read

# A newer push to the same pull request supersedes the running sweep.
concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    name: branch vs merge base (${{ matrix.libc }}-${{ matrix.arch }})
    # A pull request reports refs/pull/N/merge, which is neither main nor develop, so the
    # event has to be excluded as well: a pull request is a merge gate and sweeps everything.
    if: >-
      github.event_name != 'pull_request' && github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            arch: amd64
            runner: ubuntu-24.04
          - libc: musl
            arch: amd64
            runner: ubuntu-24.04
          - libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
          - libc: musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Two sides of five runs each. With a filter that picks one library this is minutes; a
    # change under src/common picks all six and then it costs about what the full sweep does.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lower perf_event_paranoid
        run: echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid

      # One library per changed path, and every library for anything shared: src/common holds
      # the hit slots, the policy and the token bucket, so a change there is on the hot path of
      # all six. src/init is the supervisor and has no benchmark in suite.tsv.
      - name: Pick the libraries this branch touched
        id: pick
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          base=$(git merge-base origin/develop HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          libs=
          add() {
            case ",$libs," in
              *",$1,"*) ;;
              *) libs="${libs:+$libs,}$1" ;;
            esac
          }
          for f in $(git diff --name-only "$base"..HEAD); do
            case "$f" in
              src/common/*|Makefile|benchmark/suite.tsv)
                libs=io,net,dns,time,memory,process
                break ;;
              src/time/*)                                      add time ;;
              src/net/*)                                       add net ;;
              src/dns/*)                                       add dns ;;
              src/memory/*)                                    add memory ;;
              src/process/*)                                   add process ;;
              src/core/*|src/config/*|src/effects/*|src/wrappers/*) add io ;;
            esac
          done
          chosen="${{ inputs.libs }}"
          if [ -n "$chosen" ]; then
            echo "::notice::--libs given by hand: $chosen (the diff would have said ${libs:-none})"
            libs="$chosen"
          fi
          echo "libs=$libs" >> "$GITHUB_OUTPUT"
          if [ -z "$libs" ]; then
            echo "::notice::no library source changed since $base; nothing to measure"
          else
            echo "::notice::measuring $libs against $base"
          fi

      # The merge base is measured by THIS branch's harness: only src/ and the build differ,
      # so a change to the suite or the driver cannot show up as a code regression.
      - name: Lay out the merge base
        if: steps.pick.outputs.libs != ''
        run: |
          git worktree add /tmp/base "${{ steps.pick.outputs.base }}"
          rm -rf /tmp/base/benchmark
          cp -R benchmark /tmp/base/benchmark

      # A B A B, not AAAA BBBB: a runner drifts within a job (thermal, noisy neighbours), and
      # measuring one side to completion before the other turns that drift into a verdict.
      - name: Measure both sides, alternating
        if: steps.pick.outputs.libs != ''
        env:
          BENCH_WARMUP: 5000
          BENCH_ITERS: 100000
          SIDE_RUNS: ${{ inputs.runs || '5' }}
        run: |
          mkdir -p ab/base ab/head
          i=0
          while [ "$i" -lt "$SIDE_RUNS" ]; do
            BENCH_REPORT_DIR="$PWD/ab/base" /tmp/base/benchmark/run-bench.sh \
              --libs=${{ steps.pick.outputs.libs }} --runs=1 --run-offset="$i" \
              --libc=${{ matrix.libc }}
            BENCH_REPORT_DIR="$PWD/ab/head" ./benchmark/run-bench.sh \
              --libs=${{ steps.pick.outputs.libs }} --runs=1 --run-offset="$i" \
              --libc=${{ matrix.libc }}
            i=$((i + 1))
          done

      # Exit 1 is the driver flagging the branch slower than its merge base. On a feature
      # branch that is the whole point of the job, so it fails here.
      - name: Compare
        if: steps.pick.outputs.libs != ''
        run: |
          mkdir -p ab-reports
          rc=0
          python3 benchmark/driver/chaos_bench_driver.py \
            --vs-prev ab/base --vs-prev-pct 15 --vs-prev-min-ns 25 \
            --md --output ab-reports/branch-vs-base-${{ matrix.libc }}-${{ matrix.arch }}.md \
            ab/head || rc=$?
          cat ab-reports/branch-vs-base-${{ matrix.libc }}-${{ matrix.arch }}.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::${{ matrix.libc }}-${{ matrix.arch }}: slower than the merge base"
            exit 1
          fi

      - name: Upload the comparison
        if: steps.pick.outputs.libs != ''
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.libc }}-${{ matrix.arch }}
          path: |
            ab-reports/
            ab/
          retention-days: 14
          if-no-files-found: error

  sweep:
    name: sweep (${{ matrix.libc }}-${{ matrix.arch }})
    if: >-
      github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            arch: amd64
            runner: ubuntu-24.04
          - libc: musl
            arch: amd64
            runner: ubuntu-24.04
          - libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
          - libc: musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # perf_event_paranoid=1 lets the harness open per-process hardware counters; otherwise
      # the envelopes carry the refusal reason instead of PMU data.
      - name: Lower perf_event_paranoid
        run: echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid

      - name: Check benchmark scenarios
        run: ./benchmark/run-bench.sh --check-scenarios --libc=${{ matrix.libc }}

      # Exit 1 is the A/B driver reporting preloaded slower than baseline, which preloading
      # always is; only another exit means the sweep failed.
      - name: Run benchmark sweep
        env:
          BENCH_WARMUP: 5000
          BENCH_ITERS: 100000
          BENCH_REPORT_DIR: ${{ github.workspace }}/sweep
        run: |
          mkdir -p "$BENCH_REPORT_DIR"
          rc=0
          ./benchmark/run-bench.sh --full --runs=10 --libc=${{ matrix.libc }} --compare || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::run-bench.sh failed with exit $rc"
            exit "$rc"
          fi

      - name: Upload envelopes
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.libc }}-${{ matrix.arch }}
          path: sweep/
          retention-days: 30
          if-no-files-found: error

  gate:
    name: release-over-release gate
    runs-on: ubuntu-24.04
    needs: [sweep]
    steps:
      - uses: actions/checkout@v4

      - name: Download envelopes
        uses: actions/download-artifact@v4
        with:
          path: envelopes/
          pattern: sweep-*

      # Artifact directories are named sweep-<libc>-<arch>; the gate expects <libc>-<arch>.
      - name: Arrange envelopes per variant
        run: |
          for d in envelopes/sweep-*; do
            mv "$d" "envelopes/${d#envelopes/sweep-}"
          done
          ls envelopes

      - name: Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          sh benchmark/release-gate.sh envelopes reports || rc=$?
          cat reports/gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
