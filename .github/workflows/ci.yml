# Correctness gate for every push to a long-lived or topic branch.
#
# Job graph: fmt runs first (cheap, catches the most common failure), then unit, integration,
# sanitizers and static-analysis run in parallel. Every job uses the stock ubuntu-24.04 image
# plus apt packages, which docker/Dockerfile.ci mirrors for `make ci-local`.
# Only push events trigger it; a pull request from a fork is not gated by this workflow.
# The four release variants are built and tested by matrix.yml, not here.
name: ci

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']

permissions:
  contents: read

# A newer push to the same ref supersedes the running gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs JavaScript actions on Node 24 ahead of GitHub's default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # clang-format conformance of src/ and test/ (make fmt-check). Gate for all other jobs.
  fmt:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version
      - name: Check formatting
        run: make fmt-check

  # Native libraries, unit tests, the per-file line-coverage gate and the verified doc examples.
  # The coverage report is uploaded even on failure, so a missed line can be located.
  unit:
    name: unit tests + coverage
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make lcov gcovr bc
      - name: Build native libraries
        run: make native
      - name: Run unit tests
        run: make unit
      - name: Coverage gate
        run: make coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify doc examples
        run: make verify-docs

  # Every runtime suite against the native glibc amd64 build. The Alpine suites run in
  # containers, so docker on the runner is required. Keep this list in step with
  # HOST_RUNTIME_TESTS in the Makefile.
  integration:
    name: native integration tests
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make
      - name: Build native libraries
        run: make native
      - name: Run integration tests
        # Suites exit with CHAOS_SKIP_EXIT when they cannot run (no docker, foreign
        # architecture); 1 fails the job instead of letting it pass as skipped.
        env:
          CHAOS_SKIP_EXIT: "1"
        run: |
          set -eu
          for script in \
            test/runtime/test_integration.sh \
            test/runtime/test_glibc.sh \
            test/runtime/test_alpine.sh \
            test/runtime/test_net_glibc.sh \
            test/runtime/test_net_alpine.sh \
            test/runtime/test_dns_glibc.sh \
            test/runtime/test_dns_alpine.sh \
            test/runtime/test_time_glibc.sh \
            test/runtime/test_time_alpine.sh \
            test/runtime/test_memory_glibc.sh \
            test/runtime/test_memory_alpine.sh \
            test/runtime/test_process_glibc.sh \
            test/runtime/test_process_alpine.sh \
            test/runtime/test_errno_glibc.sh \
            test/runtime/test_variants_glibc.sh \
            test/runtime/test_sharing_glibc.sh \
            test/runtime/test_baseline_glibc.sh \
            test/runtime/test_isolation_glibc.sh \
            test/runtime/test_path_forms.sh \
            test/runtime/test_status.sh \
            test/runtime/test_hits.sh \
            test/runtime/test_reload.sh \
            test/runtime/test_fork.sh \
            test/runtime/test_stdio.sh \
            test/runtime/test_init.sh \
            test/runtime/test_mptcp.sh \
            test/runtime/test_seccomp.sh
          do
            echo "::group::$script"
            sh "$script"
            echo "::endgroup::"
          done

  # Unit tests under ASan (with leak detection) and under UBSan, each in its own BUILD_DIR.
  # Both *_OPTIONS make the first report abort, so findings fail the job instead of scrolling by.
  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make
      - name: Build and run unit tests with ${{ matrix.sanitizer }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          make unit \
            BUILD_DIR=build-${{ matrix.sanitizer }} \
            CFLAGS="-std=c99 -Wall -Wextra -Werror -pedantic -O1 -g -fno-omit-frame-pointer -fsanitize=${{ matrix.sanitizer }}" \
            LDFLAGS="-fsanitize=${{ matrix.sanitizer }}"

  # Clang static analyzer over the native library build; --status-bugs fails on any finding.
  # The HTML report is uploaded only when the job fails.
  static-analysis:
    name: clang static analyzer
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-tools clang make
      - name: Run scan-build
        run: |
          scan-build --status-bugs -o scan-build-report \
            make native BUILD_DIR=build-scan
      - name: Upload scan-build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: scan-build-report/
          retention-days: 14
