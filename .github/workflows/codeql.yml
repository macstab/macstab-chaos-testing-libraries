# CodeQL security-and-quality analysis of the C sources, on every branch push and weekly
# (Monday 06:00 UTC) so that new queries reach unchanged code. CodeQL traces the compiler calls
# of `make native`, so only code compiled into the six libraries is analysed; chaos-init and the
# tests are not built here. Results go to the repository's code-scanning alerts.
name: codeql

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

# A newer push to the same ref supersedes the running analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Runs JavaScript actions on Node 24 ahead of GitHub's default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL analysis (cpp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality

      - name: Build
        run: make native

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
