name: release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    name: build all variants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build all four variants
        run: make docker-build-all

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum libchaos-*.so > SHA256SUMS
          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/libchaos-*.so
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release-assets/

      - name: Generate CHANGELOG.md with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          {
            echo "## chaos-testing-libraries $TAG"
            echo ""
            echo "Six \`LD_PRELOAD\` chaos engineering libraries:"
            echo "\`libchaos-io\`, \`libchaos-net\`, \`libchaos-dns\`,"
            echo "\`libchaos-time\`, \`libchaos-memory\`, \`libchaos-process\`."
            echo ""
            echo "### Binaries"
            echo ""
            echo "Each library is shipped in four Linux variants:"
            echo ""
            echo "| File suffix    | Distros                              |"
            echo "|----------------|--------------------------------------|"
            echo "| \`glibc-amd64\` | Debian / Ubuntu / RHEL on x86_64     |"
            echo "| \`glibc-arm64\` | Debian / Ubuntu / RHEL on ARM64      |"
            echo "| \`musl-amd64\`  | Alpine on x86_64                     |"
            echo "| \`musl-arm64\`  | Alpine on ARM64                      |"
            echo ""
            echo "Verify downloads against \`SHA256SUMS\`:"
            echo "\`\`\`sh"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "\`\`\`"
            echo ""
            echo "### Quick start"
            echo ""
            echo "\`\`\`sh"
            echo "echo '*:pread:EIO:1.0' > /tmp/.chaos-io.conf"
            echo "LD_PRELOAD=./libchaos-io-glibc-amd64.so ./your-app"
            echo "\`\`\`"
            echo ""
            echo "See [docs/IO.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/IO.md)"
            echo "and the per-library reference under [docs/](https://github.com/${{ github.repository }}/tree/${TAG}/docs)"
            echo "for the full DSL."
            echo ""
            echo "### Benchmark numbers"
            echo ""
            echo "Tier-1 ADVISORY benchmark numbers from a GitHub Actions Linux x86_64"
            echo "runner are attached as \`benchmark-comparison.md\`. These are useful"
            echo "for relative comparison only — for OFFICIAL-grade absolute numbers,"
            echo "deploy the harness to a dedicated bare-metal host with isolated CPUs."
            echo ""
            echo "See [docs/BENCHMARKS.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/BENCHMARKS.md)"
            echo "for methodology."
          } > release-notes.md

      - name: Open auto-merged PR with CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          BRANCH="chore/changelog-${TAG}"
          git config user.name  "${{ secrets.BOT_USER_NAME }}"
          git config user.email "${{ secrets.BOT_USER_EMAIL }}"
          cp CHANGELOG.md /tmp/CHANGELOG_release.md
          rm -f CHANGELOG.md
          git remote set-url origin https://x-access-token:${{ secrets.BOT_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          cp /tmp/CHANGELOG_release.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes — skipping PR"
            exit 0
          fi
          git commit -m "docs: update CHANGELOG for $TAG"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: update CHANGELOG for $TAG" \
            --body "Auto-generated changelog update for release $TAG."
          gh pr merge "$BRANCH" --squash --admin --delete-branch

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "chaos-testing-libraries $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" \
              release-assets/libchaos-*.so \
              release-assets/SHA256SUMS \
              CHANGELOG.md \
              --clobber
          else
            gh release create "$TAG" \
              --title "chaos-testing-libraries $TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              release-assets/libchaos-*.so \
              release-assets/SHA256SUMS \
              CHANGELOG.md
          fi

  bench:
    name: release benchmark sweep
    runs-on: ubuntu-24.04
    needs: [release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lower perf_event_paranoid
        run: echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid

      - name: Run full benchmark sweep
        run: ./benchmark/run-bench.sh --full --runs=5 --compare || true

      - name: Collect comparison report
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p release-bench
          if [ -f "benchmark/reports/$GIT_SHA/comparison.md" ]; then
            cp "benchmark/reports/$GIT_SHA/comparison.md" release-bench/benchmark-comparison.md
          else
            echo "_No comparison report produced for $GIT_SHA._" > release-bench/benchmark-comparison.md
          fi

      - name: Package current envelopes
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          TAG=${GITHUB_REF#refs/tags/}
          if [ -d "benchmark/reports/$GIT_SHA" ]; then
            tar -C "benchmark/reports/$GIT_SHA" -czf \
              "release-bench/bench-envelopes-${TAG}.tar.gz" .
          fi

      - name: Download previous release envelopes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV=$(gh release list --limit 20 \
                   --json tagName,isDraft,publishedAt \
                   --jq "[.[] | select(.tagName != \"$TAG\" and .isDraft == false)]
                         | sort_by(.publishedAt) | reverse
                         | .[0].tagName // \"\"")
          mkdir -p prev-envelopes
          if [ -n "$PREV" ]; then
            echo "Previous release: $PREV"
            if gh release download "$PREV" \
                 --pattern 'bench-envelopes-*.tar.gz' \
                 --dir prev-envelopes 2>/dev/null; then
              tar -xzf prev-envelopes/bench-envelopes-*.tar.gz -C prev-envelopes
              rm -f prev-envelopes/bench-envelopes-*.tar.gz
              echo "Loaded $(ls prev-envelopes/*.json 2>/dev/null | wc -l) envelopes from $PREV"
            else
              echo "No bench-envelopes asset on $PREV; skipping vs-prev gate"
              rm -rf prev-envelopes
              mkdir -p prev-envelopes
            fi
          else
            echo "No previous release found; skipping vs-prev gate"
          fi

      - name: Release-over-release regression gate
        id: vs_prev
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          if ls prev-envelopes/*.json >/dev/null 2>&1; then
            set +e
            python3 benchmark/driver/chaos_bench_driver.py \
              --vs-prev prev-envelopes \
              --vs-prev-pct 15 \
              --md \
              --output release-bench/benchmark-vs-prev.md \
              "benchmark/reports/$GIT_SHA"
            rc=$?
            set -e
            echo "driver_rc=$rc" >> "$GITHUB_OUTPUT"
            if [ "$rc" -eq 1 ]; then
              echo "::error::release-over-release regression detected (>15% slowdown vs previous release)"
            fi
          else
            echo "Skipping vs-prev gate (no prev envelopes)."
            echo "driver_rc=0" >> "$GITHUB_OUTPUT"
            echo "_Release-over-release gate skipped: no previous release envelopes._" \
              > release-bench/benchmark-vs-prev.md
          fi

      - name: Generate benchmark matrix
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          TAG=${GITHUB_REF#refs/tags/}
          python3 benchmark/driver/build_matrix.py \
            --variant glibc-amd64 "benchmark/reports/$GIT_SHA" \
            --output "release-bench/${TAG}-benchmarks.md" \
            --version "$TAG"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bench
          path: release-bench/
          retention-days: 7
          if-no-files-found: error

      - name: Attach benchmark reports to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" release-bench/benchmark-comparison.md --clobber
          gh release upload "$TAG" release-bench/benchmark-vs-prev.md --clobber
          gh release upload "$TAG" "release-bench/${TAG}-benchmarks.md" --clobber
          if [ -f "release-bench/bench-envelopes-${TAG}.tar.gz" ]; then
            gh release upload "$TAG" "release-bench/bench-envelopes-${TAG}.tar.gz" --clobber
          fi

      - name: Commit benchmark matrix to main (auto-merged PR)
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          BRANCH="chore/benchmarks-${TAG}"
          MATRIX_FILE="${TAG}-benchmarks.md"
          git config user.name  "${{ secrets.BOT_USER_NAME }}"
          git config user.email "${{ secrets.BOT_USER_EMAIL }}"
          cp "release-bench/${MATRIX_FILE}" "/tmp/${MATRIX_FILE}"
          git remote set-url origin https://x-access-token:${{ secrets.BOT_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          cp "/tmp/${MATRIX_FILE}" "${MATRIX_FILE}"
          git add "${MATRIX_FILE}"
          if git diff --cached --quiet; then
            echo "No changes to ${MATRIX_FILE} — skipping PR"
            exit 0
          fi
          git commit -m "docs(bench): add ${MATRIX_FILE}"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs(bench): add ${MATRIX_FILE}" \
            --body "Auto-generated benchmark matrix for release ${TAG}." \
            || echo "PR may already exist; continuing"
          gh pr merge "$BRANCH" --squash --admin --delete-branch

      - name: Sync main into develop (auto-merged PR)
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! gh api "repos/${{ github.repository }}/branches/develop" >/dev/null 2>&1; then
            echo "develop branch missing; skipping sync"
            exit 0
          fi
          # If develop is already up-to-date with main, skip cleanly.
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/develop...main" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "develop already contains main; skipping sync PR"
            exit 0
          fi
          gh pr create --base develop --head main \
            --title "chore: sync main into develop after ${TAG}" \
            --body "Auto-generated sync after release ${TAG} (changelog + benchmark matrix)." \
            || echo "PR may already exist; continuing"
          # Merge by head-branch name; --delete-branch is omitted since main must not be deleted.
          gh pr merge main --squash --admin

      - name: Flag release as bad on regression
        if: steps.vs_prev.outputs.driver_rc == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          {
            echo "## ⚠️ PERFORMANCE REGRESSION DETECTED"
            echo ""
            echo "Release-over-release benchmark gate flagged this release:"
            echo "current chaos-hook overhead exceeds the previous release by"
            echo "more than 15% on at least one benchmark."
            echo ""
            echo "See \`benchmark-vs-prev.md\` (attached) for the per-benchmark breakdown."
            echo "This release has been marked **prerelease** automatically."
            echo ""
            echo "---"
            echo ""
            gh release view "$TAG" --json body --jq '.body'
          } > release-notes-warned.md
          gh release edit "$TAG" \
            --prerelease \
            --notes-file release-notes-warned.md
          exit 1
