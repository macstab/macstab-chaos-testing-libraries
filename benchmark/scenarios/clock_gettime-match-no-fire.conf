# Match-no-fire arm: the errno arm's rule with probability 0.0, so the rule
# is selected and evaluated on every call but never fires.
# Selects clock_gettime(CLOCK_MONOTONIC), the kernel's clock; not CLOCK_MONOTONIC_RAW
# and CLOCK_REALTIME, which the harness itself reads for timing and file stamps.
# Proven to load and (errno arm) to fire by run-bench.sh --check-scenarios.
clock_gettime/monotonic:ERRNO:EINVAL@0.0
