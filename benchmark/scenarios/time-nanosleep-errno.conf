# Intended arm: `_errno`. Probability 1.0: every matching call takes the effect path and returns
# the injected error without the real call.
# NOT LOADED: libchaos-time takes the probability after '@' (`<selector>:ERRNO:<name>@<p>`). The
# ',' makes the errno value 'EINTR,1.0', which the parser rejects, so the library loads no rule
# and this arm measures the passthrough path. Working form: `nanosleep:ERRNO:EINTR@1.0`.
nanosleep:ERRNO:EINTR,1.0
